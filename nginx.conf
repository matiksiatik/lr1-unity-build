# ЛР №3: кастомная конфигурация Nginx для раздачи сжатой WebGL-сборки Unity 6.
# Подменяет стандартный /etc/nginx/conf.d/default.conf образа nginx:alpine:
# сжатые файлы (.gz) отдаются «как есть» с HTTP-заголовком Content-Encoding: gzip,
# чтобы браузер распаковывал их нативно, без JS-декомпрессора.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Корневая директория с файлами игры внутри контейнера (официальный образ Nginx)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Данные игры Unity (.data.gz)
    location ~* \.data\.gz$ {
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
    }

    # WebAssembly-модуль (.wasm.gz)
    location ~* \.wasm\.gz$ {
        default_type application/wasm;
        add_header Content-Encoding gzip;
    }

    # Фреймворк-рантайм Unity (.framework.js.gz)
    location ~* \.framework\.js\.gz$ {
        default_type application/javascript;
        add_header Content-Encoding gzip;
    }

    # Файл символов отладки (.symbols.gz), если присутствует
    location ~* \.symbols\.gz$ {
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
    }
}
