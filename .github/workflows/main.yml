name: Sanity Check и зеркалирование

# Триггер: рабочий процесс запускается при каждом push в репозиторий
on: [push]

jobs:
  # Задача 1: автоматическая проверка структуры проекта (Sanity Check)
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Проверка структуры проекта
        run: |
          echo "=== Sanity Check: проверка структуры проекта ==="
          fail=0
          check_path() {
            if [ -e "$1" ]; then
              echo "[OK]     $1"
            else
              echo "[ОШИБКА] $1 - не найден"
              fail=1
            fi
          }
          check_path "Assets"
          check_path "Assets/Editor/BuildManager.cs"
          check_path "Assets/Scenes/SampleScene.unity"
          check_path "ProjectSettings/ProjectSettings.asset"
          check_path "Packages/manifest.json"
          check_path "README.md"
          check_path ".gitignore"
          check_path ".github/workflows/main.yml"
          if [ "$fail" -ne 0 ]; then
            echo "Sanity Check НЕ ПРОЙДЕН: структура проекта нарушена!"
            exit 1
          fi
          echo "Sanity Check пройден: структура проекта корректна."

  # Задача 2: зеркалирование репозитория в резервный (выполняется после sanity_check)
  mirror_repo:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (полная история коммитов)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Зеркалирование в резервный репозиторий
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git checkout --detach
          git fetch origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*' --force --prune
          git remote remove origin
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git push --mirror "https://x-access-token:${BACKUP_TOKEN}@github.com/matiksiatik/lr1-unity-build-backup.git"

  # Задача 3: сборка и публикация Docker-образа в GitHub Container Registry (GHCR).
  # Папка Builds/ отсечена .gitignore, поэтому на раннере создаются временные
  # файлы-заглушки .gz — их хватит, чтобы Docker-сборка завершилась успешно
  # (реальная облачная сборка Unity будет подключена в ЛР №4).
  docker_publish:
    needs: sanity_check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Создание временных файлов-заглушек .gz для сборки образа
        run: |
          mkdir -p Builds/WebGL/Build Builds/WebGL/TemplateData
          touch Builds/WebGL/index.html
          touch Builds/WebGL/TemplateData/style.css
          touch Builds/WebGL/Build/WebGL.loader.js
          touch Builds/WebGL/Build/WebGL.framework.js.gz
          touch Builds/WebGL/Build/WebGL.wasm.gz
          touch Builds/WebGL/Build/WebGL.data.gz

      - name: Вход в GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа в GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/matiksiatik/lr1-unity-build:${{ github.sha }}
